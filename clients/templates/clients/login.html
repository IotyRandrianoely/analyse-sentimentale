<!DOCTYPE html>
<html>
<head>
    <title>Login Client</title>
    <style>
        :root {
            --primary-color: #3498db;
            --text-color: #2c3e50;
            --background-color: #f5f7fa;
            --error-color: #e74c3c;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: white;
            padding: 2.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }

        h2 {
            color: var(--text-color);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            padding: 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .messages {
            margin-bottom: 1.5rem;
        }

        .messages div {
            padding: 1rem;
            border-radius: var(--border-radius);
            background-color: #f8d7da;
            color: var(--error-color);
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .errorlist {
            color: var(--error-color);
            font-size: 0.9rem;
            list-style: none;
            padding: 0;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Fidirana</h2>
        
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <ul class="errorlist">
                    {% for error in field.errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit">miditra</button>
        </form>
    </div>
</body>
</html>
